<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 天机·决策</title>
    <style>
        :root { --primary: #00f2ea; --bg: #0a0a0f; --card: #13131f; --text: #fff; }
        body { margin: 0; padding: 20px; background: var(--bg); color: var(--text); font-family: sans-serif; }
        .container { max-width: 800px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
        
        /* 输入区域 */
        .input-card { background: var(--card); padding: 20px; border-radius: 12px; border: 1px solid #333; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #888; font-size: 14px; }
        input, select, textarea {
            width: 100%; padding: 10px; background: #000; border: 1px solid #444;
            color: #fff; border-radius: 6px; box-sizing: border-box;
        }
        
        /* 按钮样式 (普通点击) */
        .action-btn {
            width: 100%; padding: 15px; background: var(--primary); color: #000;
            border: none; border-radius: 8px; font-weight: bold; font-size: 16px;
            cursor: pointer; margin-top: 10px;
        }
        .action-btn:disabled { background: #555; cursor: not-allowed; }

        /* 结果区域 (还原你的经典布局) */
        .result-container { display: none; margin-top: 20px; animation: fade 0.5s; }
        .result-layout { display: flex; gap: 20px; flex-wrap: wrap; }
        
        /* 左侧分数卡 */
        .score-card { flex: 1; min-width: 200px; background: #1a1a2e; padding: 20px; border-radius: 12px; text-align: center; border: 1px solid #333; }
        .big-score { font-size: 60px; font-weight: bold; color: var(--primary); margin: 10px 0; }
        .level-tag { background: rgba(0,242,234,0.1); color: var(--primary); padding: 5px 15px; border-radius: 20px; display: inline-block; }

        /* 右侧文字卡 */
        .text-card { flex: 2; min-width: 300px; background: var(--card); padding: 20px; border-radius: 12px; border: 1px solid #333; }
        .card-header { border-bottom: 1px solid #333; padding-bottom: 10px; margin-bottom: 15px; font-size: 18px; font-weight: bold; color: var(--primary); }
        .content-text { line-height: 1.6; color: #ddd; font-size: 15px; text-align: justify; }

        /* 列表项 */
        .list-item { margin: 5px 0; padding: 8px; background: rgba(255,255,255,0.05); border-radius: 4px; font-size: 13px; }
        .pros { border-left: 3px solid #4cd964; }
        .cons { border-left: 3px solid #ff3b30; }

        .error-msg { display: none; background: #3d0000; color: #ff5555; padding: 10px; border-radius: 6px; margin-top: 10px; text-align: center; }

        @keyframes fade { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        /* 手机适配 */
        @media (max-width: 600px) { .result-layout { flex-direction: column; } }
    </style>
</head>
<body>

<div class="container">
    <div class="input-card">
        <h2 style="margin-top:0; color:var(--primary)">天机 · 决策</h2>
        
        <div class="form-group">
            <label>姓名</label>
            <input type="text" id="name" placeholder="请输入姓名">
        </div>
        <div class="form-group">
            <label>出生年份</label>
            <input type="number" id="year" placeholder="1998">
        </div>
        <div style="display:flex; gap:10px; margin-bottom:15px">
            <div style="flex:1"><label>月</label><input type="number" id="month" placeholder="8"></div>
            <div style="flex:1"><label>日</label><input type="number" id="day" placeholder="19"></div>
            <div style="flex:1"><label>时</label><input type="number" id="hour" placeholder="9"></div>
        </div>
        <div class="form-group">
            <label>性别</label>
            <select id="gender"><option value="1">男</option><option value="0">女</option></select>
        </div>
        <div class="form-group">
            <label>所测之事 (不填则测整体运势)</label>
            <textarea id="eventInput" rows="3" placeholder="例如：最近想换工作，是否合适？"></textarea>
        </div>

        <button id="startBtn" class="action-btn" onclick="startAnalysis()">开始推演</button>
        <div id="errorBox" class="error-msg"></div>
    </div>

    <div id="resultArea" class="result-container">
        <div class="result-layout">
            <div class="score-card">
                <div class="big-score" id="resScore">--</div>
                <div class="level-tag" id="resLevel">--</div>
                <div style="margin-top:20px; text-align:left">
                    <div style="color:#888; margin-bottom:5px">✅ 有利因素</div>
                    <div id="resPros"></div>
                </div>
                <div style="margin-top:20px; text-align:left">
                    <div style="color:#888; margin-bottom:5px">⚠️ 潜在风险</div>
                    <div id="resCons"></div>
                </div>
            </div>

            <div class="text-card">
                <div class="card-header" id="dynamicTitle">🎯 事项决策推演</div>
                <div class="content-text" id="resText">正在连接天机网络...</div>
            </div>
        </div>
    </div>
</div>

<script>
    async function startAnalysis() {
        const btn = document.getElementById('startBtn');
        const errBox = document.getElementById('errorBox');
        const resArea = document.getElementById('resultArea');
        const name = document.getElementById('name').value;
        const year = document.getElementById('year').value;
        const eventVal = document.getElementById('eventInput').value.trim();

        // 基础校验
        if(!name || !year) {
            alert("请输入姓名和年份！");
            return;
        }

        // 状态重置
        btn.disabled = true;
        btn.innerText = "正在推演中...";
        errBox.style.display = 'none';
        resArea.style.display = 'none';

        // 改动2：标题动态逻辑
        const titleElem = document.getElementById('dynamicTitle');
        if (!eventVal) {
            titleElem.innerText = "🌟 整体运势"; // 没填内容
        } else {
            titleElem.innerText = "🎯 事项决策分析"; // 填了内容
        }

        // 数据准备
        const data = {
            name: name,
            gender: parseInt(document.getElementById('gender').value),
            birth_year: parseInt(year),
            birth_month: parseInt(document.getElementById('month').value) || 1,
            birth_day: parseInt(document.getElementById('day').value) || 1,
            birth_hour: parseInt(document.getElementById('hour').value) || 12,
            event: eventVal,
            bazi_json: {}
        };

        try {
            // 发起请求
            const resp = await fetch('/api/analyze', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            });

            // 改动3：完善报错 (HTTP 错误)
            if (!resp.ok) {
                throw new Error(`服务器连接失败 (代码: ${resp.status})`);
            }

            const result = await resp.json();

            // 改动3：完善报错 (业务错误)
            if (result.score === 0 || result.level.includes("报错")) {
                throw new Error(result.core_text || "API 返回了错误数据");
            }

            // 渲染数据
            document.getElementById('resScore').innerText = result.score;
            document.getElementById('resLevel').innerText = result.level;
            document.getElementById('resText').innerText = result.core_text;
            
            // 渲染列表
            const prosDiv = document.getElementById('resPros');
            const consDiv = document.getElementById('resCons');
            prosDiv.innerHTML = (result.pros || []).map(p => `<div class="list-item pros">${p}</div>`).join('');
            consDiv.innerHTML = (result.cons || []).map(c => `<div class="list-item cons">${c}</div>`).join('');

            // 显示结果
            resArea.style.display = 'block';

        } catch (e) {
            // 显示报错框
            errBox.style.display = 'block';
            errBox.innerText = "❌ 出错啦：" + e.message;
        } finally {
            btn.disabled = false;
            btn.innerText = "开始推演";
        }
    }
</script>

</body>
</html>
